# Development stack. `docker compose up` and both services reload on save.
#
# The database is Neon (managed Postgres). Put its connection string in
# backend/.env as DATABASE_URL — see backend/.env.example.
name: projectpdf

services:
  frontend:
    build:
      context: ./frontend
      target: development
    ports:
      - "4321:4321"
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
      - ./frontend/astro.config.mjs:/app/astro.config.mjs
    environment:
      PUBLIC_API_URL: http://localhost:8010

  backend:
    build:
      context: ./backend
      target: development
    ports:
      - "8010:8000"   # 8000 is taken on this machine
    volumes:
      - ./backend/app:/app/app
      - ./backend/tests:/app/tests
      # Live so `ruff`/`pytest` config edits apply without a rebuild.
      - ./backend/pyproject.toml:/app/pyproject.toml
    env_file:
      # Real secrets live here and are git-ignored.
      - path: ./backend/.env
        required: false
    environment:
      ENVIRONMENT: development
      DEBUG: "true"
      CORS_ORIGINS: '["http://localhost:4321","http://127.0.0.1:4321"]'
