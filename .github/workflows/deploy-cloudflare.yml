name: Deploy site to Cloudflare Pages

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/deploy-cloudflare.yml'
  workflow_dispatch:

# One deploy at a time; let a running one finish rather than shipping a
# half-uploaded site.
concurrency:
  group: cloudflare-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6
        with:
          # Sitemap lastmod dates come from git history, not the build clock.
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: Test delivered-page privacy checks
        run: node --test scripts/privacy-delivery.test.mjs scripts/indexnow.test.mjs

      - name: Build production site
        # SITE_ORIGIN drives canonicals, sitemap, robots, llms.txt and the
        # structured data. Without it the build emits github.io URLs.
        env:
          SITE_ORIGIN: https://filozy.com
          PUBLIC_BUILD_ID: ${{ github.sha }}
          INDEXNOW_KEY: ${{ vars.INDEXNOW_KEY }}
          PUBLIC_GOOGLE_SITE_VERIFICATION: ${{ vars.GOOGLE_SITE_VERIFICATION }}
          PUBLIC_BING_SITE_VERIFICATION: ${{ vars.BING_SITE_VERIFICATION }}
        run: npm run build

      - name: Check PDF operation invariants
        run: npm run test:operations

      - name: Install isolated browser for regression tests
        run: npx playwright install --with-deps chromium

      - name: Test mobile saving and all live tools before publishing
        env:
          SITE_ORIGIN: https://filozy.com
          PROJECTPDF_AUDIT_BASE: http://127.0.0.1:4326
        run: |
          npx astro preview --host 127.0.0.1 --port 4326 --background
          npm run audit:browser-operations

      - name: Publish to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: >-
          npx --yes wrangler@latest pages deploy dist
          --project-name=filozy
          --branch=main
          --commit-dirty=true

      - name: Verify delivered release and privacy disclosures
        env:
          SITE_ORIGIN: https://filozy.com
          PUBLIC_BUILD_ID: ${{ github.sha }}
        run: node scripts/audit-live-delivery.mjs

      - name: Notify participating search engines of the verified production release
        if: ${{ vars.INDEXNOW_KEY != '' }}
        continue-on-error: true
        env:
          SITE_ORIGIN: https://filozy.com
          INDEXNOW_KEY: ${{ vars.INDEXNOW_KEY }}
        run: node scripts/submit-indexnow.mjs
